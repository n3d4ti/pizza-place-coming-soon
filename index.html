<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domifalatozó - Hamarosan Nyitunk!</title>
    <meta name="description" content="Domifalatozó pizza étterem - A weboldal jelenleg fejlesztés alatt. Hívj minket és add le rendelésedet telefonon!" />
    <meta name="author" content="Domifalatozó" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Domifalatozó - Hamarosan Nyitunk!" />
    <meta property="og:description" content="Domifalatozó pizza étterem - A weboldal jelenleg fejlesztés alatt. Hívj minket és add le rendelésedet telefonon!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="src/assets/pizza-hero.jpg" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Domifalatozó - Hamarosan Nyitunk!" />
    <meta name="twitter:description" content="Domifalatozó pizza étterem - A weboldal jelenleg fejlesztés alatt. Hívj minket és add le rendelésedet telefonon!" />
    <meta name="twitter:image" content="src/assets/pizza-hero.jpg" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        line-height: 1.6;
        color: #333;
        overflow-x: hidden;
      }

      .hero-section {
        min-height: 100vh;
        background: linear-gradient(135deg, rgba(139, 69, 19, 0.8), rgba(205, 92, 92, 0.6)), 
                    url('src/assets/pizza-hero.jpg') center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 2rem;
      }

      .content-container {
        text-align: center;
        color: white;
        max-width: 600px;
        z-index: 2;
      }

      .construction-badge {
        display: inline-block;
        background: rgba(255, 193, 7, 0.9);
        color: #8B4513;
        padding: 0.5rem 1.5rem;
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 2rem;
        animation: pulse 2s infinite;
        backdrop-filter: blur(10px);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      .restaurant-name {
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 700;
        margin-bottom: 2rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        color: #FFF8DC;
        font-family: 'Georgia', serif;
      }

      .message-text {
        font-size: clamp(1rem, 3vw, 1.4rem);
        margin-bottom: 3rem;
        line-height: 1.8;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        padding: 0 1rem;
      }

      .contact-card {
        background: rgba(139, 69, 19, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        margin: 0 auto;
        max-width: 400px;
      }

      .contact-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      }

      .contact-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: #FFF8DC;
      }

      .phone-number {
        font-size: 2rem;
        font-weight: 700;
        color: #FFD700;
        text-decoration: none;
        display: block;
        margin-bottom: 1rem;
        transition: color 0.3s ease;
      }

      .phone-number:hover {
        color: #FFA500;
        text-decoration: underline;
      }

      .contact-subtitle {
        font-size: 1rem;
        color: #F5DEB3;
        opacity: 0.9;
      }

      .pizza-emoji {
        font-size: 4rem;
        display: block;
        margin-bottom: 1rem;
        animation: rotate 10s linear infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @media (max-width: 768px) {
        .hero-section {
          padding: 1rem;
        }
        
        .contact-card {
          padding: 2rem;
          margin: 0 1rem;
        }
        
        .restaurant-name {
          margin-bottom: 1.5rem;
        }
        
        .message-text {
          margin-bottom: 2rem;
          padding: 0;
        }
      }

      @media (max-width: 480px) {
        .construction-badge {
          font-size: 0.8rem;
          padding: 0.4rem 1rem;
          margin-bottom: 1.5rem;
        }
        
        .contact-card {
          padding: 1.5rem;
        }
        
        .phone-number {
          font-size: 1.5rem;
        }
        
        .pizza-emoji {
          font-size: 3rem;
        }
      }

      /* Loading animation */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #8B4513;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loading-pizza {
        font-size: 5rem;
        animation: bounce 1s infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-20px); }
        60% { transform: translateY(-10px); }
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-pizza">🍕</div>
    </div>

    <!-- Main Content -->
    <section class="hero-section">
      <div class="content-container">
        <div class="construction-badge">
          🚧 Fejlesztés alatt 🚧
        </div>
        
        <h1 class="restaurant-name">Domifalatozó</h1>
        
        <p class="message-text">
          A weboldal jelenleg fejlesztés alatt. Addigis hívj minket és add le a rendelésed gyorsan telefonon. Köszi a megértést.
        </p>
        
        <div class="contact-card">
          <span class="pizza-emoji">🍕</span>
         
          <a href="tel:+36203331115" class="phone-number">+36 20 333 1115</a>
          <p class="contact-subtitle">Hívj bátran, várjuk rendelésedet!</p>
        </div>
      </div>
    </section>

    <script>
      // Simple loading screen with fade out
      window.addEventListener('load', function() {
        const loadingOverlay = document.getElementById('loadingOverlay');
        setTimeout(() => {
          loadingOverlay.classList.add('fade-out');
          setTimeout(() => {
            loadingOverlay.style.display = 'none';
          }, 500);
        }, 1000);
      });

      // Add subtle parallax effect on scroll (optional)
      window.addEventListener('scroll', function() {
        const scrolled = window.pageYOffset;
        const heroSection = document.querySelector('.hero-section');
        if (heroSection) {
          heroSection.style.transform = `translateY(${scrolled * 0.5}px)`;
        }
      });

      // Phone number click tracking (console log for development)
      document.querySelector('.phone-number').addEventListener('click', function(e) {
        console.log('Phone number clicked: +36203331115');
      });

      // Add some interactive hover effects
      document.querySelector('.contact-card').addEventListener('mouseenter', function() {
        this.style.background = 'rgba(139, 69, 19, 0.95)';
      });

      document.querySelector('.contact-card').addEventListener('mouseleave', function() {
        this.style.background = 'rgba(139, 69, 19, 0.9)';
      });
    </script>
  </body>
</html>
